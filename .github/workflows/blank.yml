name: Build Windows Setup

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (e.g. v0.2.0); leave blank for build only"
        required: false
        type: string
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install dependencies
        working-directory: AonangReplaySystem_Setup_Builder/AonangReplaySystem
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile application
        working-directory: AonangReplaySystem_Setup_Builder/AonangReplaySystem
        run: python -m PyInstaller --noconfirm --clean --windowed --name AonangReplaySystem --collect-all PySide6 --collect-all cv2 --collect-all obsws_python src/main.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE "AonangReplaySystem_Setup_Builder\AonangReplaySystem"
          $script = Join-Path $project "AONANG_REPLAY_SETUP.iss"
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          $appExe = Join-Path $project "dist\AonangReplaySystem\AonangReplaySystem.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          if (!(Test-Path $script)) { throw "Installer script not found: $script" }
          if (!(Test-Path $appExe)) { throw "PyInstaller EXE not found: $appExe" }
          $distDir = Join-Path $project "dist\AonangReplaySystem"
          if (!(Test-Path $distDir)) { throw "PyInstaller output folder not found: $distDir" }
          # Remove Qt/PySide6 build-time artifacts that are not needed at runtime.
          Get-ChildItem $distDir -Recurse -File -Include *.obj,*.cpp -ErrorAction SilentlyContinue | Remove-Item -Force
          $outputDir = Join-Path $env:RUNNER_TEMP "AonangReplayInstaller"
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          Write-Host "Project: $project"
          Write-Host "Installer script: $script"
          Write-Host "PyInstaller output: $distDir"
          Write-Host "Installer output: $outputDir"
          Write-Host "Current directory before compile: $((Get-Location).Path)"
          Write-Host "Output directory exists: $(Test-Path $outputDir)"
          Write-Host "Installer source files:"
          Get-ChildItem $distDir | Select-Object -First 10 Name
          Push-Location $project
          try {
            & $compiler "/O$outputDir" $script
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }
          } finally {
            Pop-Location
          }
          $setup = Join-Path $outputDir "Setup_AonangReplaySystem.exe"
          if (!(Test-Path $setup)) { throw "Setup.exe was not created: $setup" }
          Get-Item $setup | Select-Object FullName, Length
          $hashFile = Join-Path $outputDir "SHA256SUMS.txt"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  Setup_AonangReplaySystem.exe" | Set-Content -Path $hashFile -Encoding ascii
          Write-Host "Installer SHA-256: $hash"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AonangReplaySystem-Setup-Windows
          path: |
            ${{ runner.temp }}/AonangReplayInstaller/Setup_AonangReplaySystem.exe
            ${{ runner.temp }}/AonangReplayInstaller/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: |
          $outputDir = Join-Path $env:RUNNER_TEMP "AonangReplayInstaller"
          $setup = Join-Path $outputDir "Setup_AonangReplaySystem.exe"
          $hashFile = Join-Path $outputDir "SHA256SUMS.txt"
          if (!(Test-Path $setup)) { throw "Installer missing; release cancelled." }
          if (!(Test-Path $hashFile)) { throw "SHA256 file missing; release cancelled." }
          if ($env:GITHUB_REF.StartsWith("refs/tags/v")) {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = $env:RELEASE_VERSION_INPUT.Trim()
          }
          if ($version -notmatch "^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$") {
            throw "Invalid release version '$version'. Use a version like v0.2.0."
          }
          gh release create "$version" $setup $hashFile --title "Aonang Replay System $version" --generate-notes
