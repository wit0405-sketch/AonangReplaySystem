name: Build Windows Setup

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install dependencies
        working-directory: AonangReplaySystem_Setup_Builder/AonangReplaySystem
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build application EXE
        working-directory: AonangReplaySystem_Setup_Builder/AonangReplaySystem
        run: python -m PyInstaller --noconfirm --windowed --name AonangReplaySystem --collect-all PySide6 src/main.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE "AonangReplaySystem_Setup_Builder\AonangReplaySystem"
          $script = Join-Path $project "AONANG_REPLAY_SETUP.iss"
          $output = Join-Path $project "installer_output"
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          if (!(Test-Path $script)) { throw "Installer script not found: $script" }
          if (!(Test-Path (Join-Path $project "dist\AonangReplaySystem\AonangReplaySystem.exe"))) { throw "PyInstaller EXE not found in dist folder" }
          Push-Location $project
          try {
            & $compiler "/O$output" $script
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }
          } finally {
            Pop-Location
          }
          if (!(Test-Path (Join-Path $output "Setup_AonangReplaySystem.exe"))) { throw "Setup.exe was not created in $output" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AonangReplaySystem-Setup-Windows
          path: AonangReplaySystem_Setup_Builder/AonangReplaySystem/installer_output/Setup_AonangReplaySystem.exe
          if-no-files-found: error
          retention-days: 14
