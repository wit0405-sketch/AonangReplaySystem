name: Build Windows Setup

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: AonangReplaySystem_Setup_Builder/AonangReplaySystem
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build application EXE
        run: python -m PyInstaller --noconfirm --windowed --name AonangReplaySystem --collect-all PySide6 src/main.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
        working-directory: .

      - name: Build Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer_output | Out-Null
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not found at $compiler" }
          & $compiler "AONANG_REPLAY_SETUP.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }
          if (!(Test-Path "installer_output\Setup_AonangReplaySystem.exe")) { throw "Setup.exe was not created" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AonangReplaySystem-Setup-Windows
          path: AonangReplaySystem_Setup_Builder/AonangReplaySystem/installer_output/Setup_AonangReplaySystem.exe
          if-no-files-found: error
          retention-days: 14
